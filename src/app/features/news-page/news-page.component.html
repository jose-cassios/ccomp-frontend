<section class="news-page-section">
  <div class="news-page-layout">
    <div class="news-main">
      <div class="news-header">
        <h1 class="page-title">Notícias</h1>
        <button class="btn-create-news" (click)="openModal()">
          <span class="btn-icon">+</span>
          Nova Notícia
        </button>
      </div>

      @if (!isLoading()) {
        <app-news-hero [news]="noticiaDestaque()"></app-news-hero>
        
        <div class="news-list-header">
          <h2 class="news-list-title">Mais Notícias</h2>
        </div>
        
        <div class="news-grid">
          @for (noticia of noticiasLista(); track noticia.id) {
            <app-news-card [news]="noticia"></app-news-card>
          }
        </div>
      } @else {
        <p>Carregando notícias...</p>
      }
      
    </div>
    
    <app-news-sidebar></app-news-sidebar>
    
  </div>

  <app-news-modal 
    [isOpen]="modalOpen()" 
    (close)="closeModal()" 
    (save)="onSaveNews($event)"
  ></app-news-modal>
</section>

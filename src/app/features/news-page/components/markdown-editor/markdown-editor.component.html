<div class="markdown-editor">
  <div class="markdown-toolbar" aria-label="Formatação Markdown">
    <button type="button" title="Título" [disabled]="disabled()" (click)="prefixLines('## ')">H2</button>
    <button type="button" title="Negrito" [disabled]="disabled()" (click)="format('**')"><strong>B</strong></button>
    <button type="button" title="Itálico" [disabled]="disabled()" (click)="format('*')"><em>I</em></button>
    <button type="button" title="Link" [disabled]="disabled()" (click)="format('[', '](https://)', 'texto do link')">Link</button>
    <button type="button" title="Lista" [disabled]="disabled()" (click)="prefixLines('- ')">Lista</button>
    <button type="button" title="Citação" [disabled]="disabled()" (click)="prefixLines('> ')">Citação</button>
    <button type="button" title="Código" [disabled]="disabled()" (click)="format('`')">Código</button>
    <span class="markdown-hint">Markdown</span>
  </div>
  <textarea
    #editor
    [value]="content()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    aria-label="Conteúdo da notícia em Markdown"
    placeholder="# Comece com um título&#10;&#10;Escreva o conteúdo da notícia usando Markdown..."
    spellcheck="true"
  ></textarea>
</div>

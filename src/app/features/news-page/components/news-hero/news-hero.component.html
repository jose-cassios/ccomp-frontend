<article class="news-hero">
  <div class="hero-image">
    <img [src]="news().coverImageUrl ?? news().cover_image_url" [alt]="news().title" />
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <span class="hero-badge">Destaque</span>
    <h1 class="hero-title">{{ news().title }}</h1>
    <p class="hero-summary">{{ news().summary }}</p>
    <div class="hero-meta">
      <span class="meta-author">{{ news().autorId }}</span>
      <span class="meta-separator">•</span>
      <span class="meta-date">{{ news().publishedAt ?? news().published_at }}</span>
    </div>
    <a [routerLink]="['/news', news().slug]" class="hero-link">
      Ler mais
      <span class="arrow">→</span>
    </a>
  </div>
</article>

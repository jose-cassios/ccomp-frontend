<div class="cta-container">
  <div class="cta-content">
    <h2 class="cta-title">Quer propor um evento ou palestra?</h2>
    
    <p class="cta-description">
      O Algorithmic Greenhouse é um espaço aberto para ideias. Se você tem
      um projeto, pesquisa ou tópico que deseja compartilhar, nossa equipe
      está pronta para ajudar.
    </p>

    <div class="cta-actions">
      <button class="btn btn-primary" (click)="onEnviarProposta()">
        Enviar Proposta
      </button>
      <button class="btn btn-outline" (click)="onVerDiretrizes()">
        Ver Diretrizes
      </button>
    </div>
  </div>
  
  <div class="background-overlay"></div>
</div>

<div class="register-container">
  <mat-card class="register-card">
    <div class="register-header">
      <mat-card-header>
        <mat-card-title>Criar Conta</mat-card-title>
        <mat-card-subtitle>Junte-se ao CCOMP</mat-card-subtitle>
      </mat-card-header>
    </div>
    
    <mat-card-content>
      @if (errorMessage()) {
        <p class="auth-error" role="alert">{{ errorMessage() }}</p>
      }
      <app-register-form
        [isSubmitting]="isSubmitting()"
        (register)="onRegister($event)"
      ></app-register-form>
      
      <div class="divider-container">
        <mat-divider></mat-divider>
        <span class="divider-text">ou</span>
        <mat-divider></mat-divider>
      </div>
      
      <app-google-login [disabled]="isSubmitting()" (busyChange)="isSubmitting.set($event)" />
    </mat-card-content>
    
    <mat-card-actions>
      <button (click)="navigateToLogin()" class="login-link" mat-button [disabled]="isSubmitting()">
        Já tem uma conta? Faça login
      </button>
    </mat-card-actions>
  </mat-card>
</div>

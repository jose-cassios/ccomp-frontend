<div class="login-container">
  <mat-card class="login-card">

    <div class="login-header">
      <mat-card-header>
        <mat-card-title>Entrar</mat-card-title>
        <mat-card-subtitle>Acesse sua conta CCOMP</mat-card-subtitle>
      </mat-card-header>
    </div>

    <mat-card-content>
      @if (errorMessage()) {
        <p class="auth-error" role="alert">{{ errorMessage() }}</p>
      }
      <app-login-form
        [isSubmitting]="isSubmitting()"
        (login)="onLogin($event)"
      ></app-login-form>

      <div class="social-login" aria-label="Outras formas de acesso">
        <span>ou</span>
        <app-google-login [disabled]="isSubmitting()" (busyChange)="isSubmitting.set($event)" />
      </div>
    </mat-card-content>
    
    <mat-card-actions>
      <a routerLink="/recuperar-senha" class="register-link" mat-button>Esqueceu sua senha?</a>
      <button (click)="navigateToRegister()" class="register-link" mat-button>
        Não tem uma conta? Cadastre-se
      </button>
    </mat-card-actions>

  </mat-card>
</div>

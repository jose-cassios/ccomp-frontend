<section class="noticias-container">
  <div class="noticias-wrapper">
    <!-- A pausa fica no carrossel, não na seção -->
    <div
      class="carousel-viewport"
      (mouseenter)="autoplayPausado.set(true)"
      (mouseleave)="autoplayPausado.set(false)"
    >
      <div class="carousel-stage">
        @for (clube of clubes; track clube.id; let i = $index) {
          <!-- Todos os cards ficam no DOM: só o ativo é visível, o resto faz o crossfade -->
          <div
            class="notice-card"
            [class.is-active]="i === currentIndex()"
            [attr.inert]="i === currentIndex() ? null : ''"
            [attr.aria-hidden]="i === currentIndex() ? null : 'true'"
          >
            <div class="notice-image">
              <img [src]="clube.imagem" [alt]="clube.nome" />
            </div>
            <div class="description-notice">
              <span class="category-tag">{{ clube.categoria }}</span>
              <h3>{{ clube.nome }}</h3>
              <p>{{ clube.descricao }}</p>
            </div>
            <a
              class="btn-cta-light"
              [routerLink]="clube.link"
              [attr.aria-label]="'Quero me inscrever no ' + clube.nome"
            >
              Quero me inscrever
            </a>
          </div>
        }
      </div>

      <div class="carousel-indicators">
        @for (clube of clubes; track clube.id; let i = $index) {
          <button
            type="button"
            class="dot"
            [class.active]="i === currentIndex()"
            [attr.aria-label]="'Ir para o clube ' + clube.nome"
            [attr.aria-current]="i === currentIndex()"
            (click)="goTo(i)"
          ></button>
        }
      </div>
    </div>

    <div class="notice-side-content">
      <div class="section-header">
        <span class="linha-verde"></span>
        <span class="label">{{ labelSessao }}</span>
      </div>
      <h2 class="main-notice-title">{{ clubeAtual().chamada }}</h2>
      <a
        class="btn-secondary"
        [routerLink]="clubeAtual().link"
        [attr.aria-label]="'Ver informações do ' + clubeAtual().nome"
      >
        Ver informações
      </a>
    </div>
  </div>
</section>

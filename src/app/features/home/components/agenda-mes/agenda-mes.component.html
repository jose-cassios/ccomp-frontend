<div class="split-layout">
  <div class="agenda-wrapper">
    <div class="section-header">
      <span class="linha-verde"></span>
      <h3>AGENDA DO MÊS</h3>
    </div>
    <div class="agenda-list">
      @for(item of agendaMes(); track item.id){
        <a class="agenda-item" [routerLink]="['/eventos', item.id]">
          <div class="agenda-date">
            <span class="month">{{ item.start_date | date: 'MMM' }}</span>
            <span class="day">{{ item.start_date | date: 'dd' }}</span>
          </div>
          <div class="agenda-info">
            <span class="agenda-tag">{{ categoryLabel(item.category) }}</span>
            <h4>{{ item.title }}</h4>
          </div>
        </a>
      } @empty {
        <p>Nenhum evento disponível na agenda.</p>
      }
      <a class="btn-text" routerLink="/eventos">Ver calendário completo →</a>
    </div>
  </div>
</div>

<article class="card-item">
  <div class="card-media">
    <img [src]="destaque().cover_image_url" [alt]="destaque().title" />
  </div>

  <div class="card-body">
    <h4>{{ destaque().title }}</h4>
    <p class="card-description">
      {{ destaque().summary }}
    </p>
  </div>

  <div class="card-footer">
    <a [routerLink]="'/news/' + destaque().slug" class="btn-read-more">Leia completo →</a>
  </div>
</article>

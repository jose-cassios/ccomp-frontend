<div class="page-wrapper">
  <section class="full-width-section">
    <app-banner
      [highlights]="highlights()"
      [eventsCount]="events().length"
      [newsCount]="newsItems().length"
      [canManageHighlights]="canManageHighlights()"
      (manageHighlights)="openHighlightEditor()"
    ></app-banner>
  </section>

  <section class="section-container">
    <app-agenda-mes [events]="events()"></app-agenda-mes>
  </section>

  <section class="section-container">
    <app-eventos-andamento [eventos]="ongoingEvents()"></app-eventos-andamento>
  </section>

  <section class="full-width-section">
    <app-noticias-clube></app-noticias-clube>
  </section>

  <section class="section-container">
    <app-destaques-semana [newsItems]="newsItems()"></app-destaques-semana>
  </section>

  <app-hero-highlight-editor
    [open]="highlightEditorOpen()"
    [loadingCategories]="highlightCandidatesLoading()"
    [saving]="highlightSaving()"
    [categoryErrors]="highlightCandidateErrors()"
    [saveError]="highlightSaveError()"
    [candidates]="highlightCandidates()"
    [selectedItems]="highlights()"
    (categoryRequested)="loadHighlightCandidates($event)"
    (closed)="closeHighlightEditor()"
    (saved)="saveHighlights($event)"
  />
</div>

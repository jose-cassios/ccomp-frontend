<div class="page-wrapper">
  <section class="full-width-section">
    <app-banner
      [highlights]="highlights()"
      [events]="events()"
      [newsCount]="newsItems().length"
      [eventsLoading]="eventsLoading()"
      [eventsError]="eventsError()"
      (retryEvents)="loadEvents()"
      [canManageHighlights]="canManageHighlights()"
      (manageHighlights)="openHighlightEditor()"
    ></app-banner>
  </section>

  <section class="section-container">
    <app-destaques-semana [newsItems]="newsItems()"></app-destaques-semana>
  </section>

  <app-hero-highlight-editor
    [open]="highlightEditorOpen()"
    [highlights]="highlights()"
    (closed)="closeHighlightEditor()"
  />
</div>
